<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Quest - Sin marcador</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- Animaciones del robot descargado (animation-mixer) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; overflow: hidden;
      background: linear-gradient(#1b2a5a, #4a6fa5); touch-action: none; user-select: none; }

    /* Cámara opcional como fondo */
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      z-index: -1; display: none; }

    #panel {
      position: fixed; top: 10px; left: 10px; z-index: 999;
      background: rgba(0, 0, 0, 0.75); color: #fff;
      padding: 10px 14px; border-radius: 10px; font-size: 16px; line-height: 1.5;
    }
    #panel b { color: #FFD700; }
    .btn { margin-top: 6px; margin-right: 4px; padding: 7px 12px; border: none;
      border-radius: 6px; cursor: pointer; font-size: 14px; }

    /* Botones de dirección (celular o mouse) */
    #dpad { position: fixed; bottom: 22px; left: 22px; z-index: 999;
      display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(3, 62px); gap: 6px; }
    #dpad button { border: none; border-radius: 14px; font-size: 26px;
      background: rgba(0, 0, 0, 0.6); color: #fff; touch-action: none; }
    #dpad button.activo { background: #FFD700; color: #222; }
    #dpad .arriba { grid-area: 1 / 2; } #dpad .izq { grid-area: 2 / 1; }
    #dpad .der { grid-area: 2 / 3; }    #dpad .abajo { grid-area: 3 / 2; }

    #ayuda { position: fixed; bottom: 22px; right: 18px; z-index: 999; color: #fff;
      background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 10px; font-size: 14px;
      text-align: right; max-width: 190px; }

    #pantalla {
      position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: rgba(10, 10, 40, 0.88); color: #fff; padding: 20px;
    }
    #pantalla h1 { font-size: 34px; margin: 0 0 10px; }
    #pantalla p  { font-size: 18px; max-width: 460px; margin: 6px 0; }
    #pantalla button { margin-top: 18px; padding: 14px 30px; font-size: 20px; border: none;
      border-radius: 12px; background: #FFD700; color: #222; cursor: pointer; }
    #pantalla.oculta { display: none; }
  </style>
</head>

<body>
  <video id="video" autoplay playsinline muted></video>

  <div id="panel">
    <div>Nivel: <b id="nivel">1</b> / 3</div>
    <div>Puntos: <b id="puntos">0</b></div>
    <div>Meta del nivel: <b id="meta">0</b></div>
    <div>Tiempo: <b id="tiempo">0</b> s</div>
    <div>Récord: <b id="record">0</b></div>
    <button class="btn" id="reiniciar">Reiniciar</button>
    <button class="btn" id="btnCamara">📷 Cámara de fondo</button>
  </div>

  <div id="dpad">
    <button class="arriba" data-dir="arriba">▲</button>
    <button class="izq" data-dir="izq">◀</button>
    <button class="der" data-dir="der">▶</button>
    <button class="abajo" data-dir="abajo">▼</button>
  </div>

  <div id="ayuda">Mueve al robot con W A S D, las flechas o los botones</div>

  <div id="pantalla">
    <h1 id="pTitulo">AR Quest</h1>
    <p id="pTexto">Mueve al robot hasta las monedas doradas (+10) y los cristales azules (+20). ¡Evita las esferas rojas, restan puntos! Alcanza la meta antes de que se acabe el tiempo.</p>
    <button id="pBoton">Jugar</button>
  </div>

  <a-scene vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true"
           background="transparent: true" embedded
           style="position: fixed; inset: 0; width: 100%; height: 100%;">

    <a-entity light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; intensity: 0.7" position="2 6 4"></a-entity>

    <!-- Cámara fija mirando la arena (se ajusta en el script según la pantalla) -->
    <a-entity id="camara" camera="fov: 60" position="0 6.5 6.5" rotation="-45 0 0"
              look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>

    <!-- Piso de la arena -->
    <a-plane rotation="-90 0 0" width="6.4" height="6.4" color="#7BC8A4" opacity="0.9"></a-plane>
    <a-plane rotation="-90 0 0" position="0 0.01 0" width="6.4" height="6.4"
             material="color: #ffffff; wireframe: true; opacity: 0.35; transparent: true"
             segments-width="8" segments-height="8"></a-plane>

    <!-- Robot 3D descargado de un catálogo (three.js, RobotExpressive, CC0) -->
    <a-entity id="robot" position="0 0 0">
      <a-entity id="robotGLB" scale="0.3 0.3 0.3"
                gltf-model="url(https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb)"
                animation-mixer="clip: Idle"></a-entity>
      <!-- Respaldo con figuras básicas si el modelo no carga -->
      <a-entity id="robotRespaldo" visible="false">
        <a-box position="0 0.55" width="0.55" height="0.55" depth="0.35" color="#3b82f6"></a-box>
        <a-box position="0 1.05" width="0.38" height="0.32" depth="0.32" color="#3b82f6"></a-box>
        <a-sphere position="-0.08 1.08 0.17" radius="0.05" color="#fff"></a-sphere>
        <a-sphere position="0.08 1.08 0.17" radius="0.05" color="#fff"></a-sphere>
        <a-cylinder position="-0.15 0.14" radius="0.07" height="0.28" color="#444"></a-cylinder>
        <a-cylinder position="0.15 0.14" radius="0.07" height="0.28" color="#444"></a-cylinder>
      </a-entity>
    </a-entity>

    <!-- Aquí se crean por JavaScript las monedas, cristales y enemigos -->
    <a-entity id="zonaJuego"></a-entity>
  </a-scene>

<script>
  /* ============================================================
     CONFIGURACIÓN: tres niveles con distintos tiempos
     ============================================================ */
  const NIVELES = [
    { tiempo: 45, meta: 50,  monedas: 4, enemigos: 1, velEnemigo: 1.0 },
    { tiempo: 35, meta: 80,  monedas: 5, enemigos: 2, velEnemigo: 1.4 },
    { tiempo: 30, meta: 110, monedas: 6, enemigos: 3, velEnemigo: 1.8 }
  ];
  const PUNTOS_ENEMIGO = 15;
  const LIMITE = 2.8;          // la arena va de -2.8 a 2.8 en X y Z
  const VEL_ROBOT = 3.2;       // unidades por segundo
  const RADIO_CHOQUE = 0.65;

  /* ---------- Estado ---------- */
  let nivel = 0, puntosNivel = 0, puntosTotal = 0, tiempo = 0;
  let estado = "inicio";       // inicio | jugando | pausa | fin
  let record = leerRecord();
  let coleccionables = [];     // monedas y cristales { el, x, z, valor, cristal }
  let enemigos = [];           // { el, x, z, objX, objZ }
  let invulnerableHasta = 0;

  const $ = id => document.getElementById(id);
  const zona = $("zonaJuego");
  const robot = $("robot");
  const robotGLB = $("robotGLB");
  const pos = { x: 0, z: 0 };

  /* ============================================================
     RÉCORD guardado en el navegador
     ============================================================ */
  function leerRecord() {
    try { return parseInt(localStorage.getItem("arquest_record")) || 0; } catch (e) { return 0; }
  }
  function guardarRecord() {
    if (puntosTotal > record) {
      record = puntosTotal;
      try { localStorage.setItem("arquest_record", record); } catch (e) {}
    }
    $("record").textContent = record;
  }

  /* ============================================================
     SONIDOS creados con código
     ============================================================ */
  let audio = null;
  function tono(f, dur, tipo = "sine", retraso = 0) {
    if (!audio) return;
    const t0 = audio.currentTime + retraso;
    const osc = audio.createOscillator(), vol = audio.createGain();
    osc.type = tipo; osc.frequency.value = f;
    vol.gain.setValueAtTime(0.2, t0);
    vol.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(vol); vol.connect(audio.destination);
    osc.start(t0); osc.stop(t0 + dur);
  }
  const sonidoMoneda  = () => { tono(880, 0.1, "square"); tono(1320, 0.15, "square", 0.08); };
  const sonidoCristal = () => { tono(1000, 0.1); tono(1500, 0.1, "sine", 0.08); tono(2000, 0.2, "sine", 0.16); };
  const sonidoEnemigo = () => { tono(160, 0.3, "sawtooth"); tono(110, 0.3, "sawtooth", 0.15); };
  const sonidoNivel   = () => [523, 659, 784, 1047].forEach((f, i) => tono(f, 0.2, "triangle", i * 0.12));
  const sonidoDerrota = () => [400, 330, 260, 200].forEach((f, i) => tono(f, 0.25, "sawtooth", i * 0.15));
  function activarAudio() {
    if (!audio) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
    if (audio && audio.state === "suspended") audio.resume();
  }

  /* ============================================================
     ROBOT: animaciones del modelo
     ============================================================ */
  function animarRobot(clip, ms = 900) {
    robotGLB.setAttribute("animation-mixer", "clip: " + clip);
    clearTimeout(animarRobot.t);
    animarRobot.t = setTimeout(() => {
      if (estado !== "fin") robotGLB.setAttribute("animation-mixer", "clip: Idle");
    }, ms);
  }
  robotGLB.addEventListener("model-error", () => {
    robotGLB.setAttribute("visible", false);
    $("robotRespaldo").setAttribute("visible", true);
  });

  /* ============================================================
     CONTROLES: teclado y botones en pantalla
     ============================================================ */
  const teclas = { arriba: false, abajo: false, izq: false, der: false };
  const mapaTeclas = {
    ArrowUp: "arriba", w: "arriba", W: "arriba",
    ArrowDown: "abajo", s: "abajo", S: "abajo",
    ArrowLeft: "izq", a: "izq", A: "izq",
    ArrowRight: "der", d: "der", D: "der"
  };
  window.addEventListener("keydown", e => {
    const dir = mapaTeclas[e.key];
    if (dir) { teclas[dir] = true; e.preventDefault(); }
  });
  window.addEventListener("keyup", e => {
    const dir = mapaTeclas[e.key];
    if (dir) teclas[dir] = false;
  });

  document.querySelectorAll("#dpad button").forEach(b => {
    const dir = b.dataset.dir;
    const poner = v => e => { e.preventDefault(); teclas[dir] = v; b.classList.toggle("activo", v); };
    b.addEventListener("pointerdown", poner(true));
    b.addEventListener("pointerup", poner(false));
    b.addEventListener("pointerleave", poner(false));
    b.addEventListener("pointercancel", poner(false));
    b.addEventListener("contextmenu", e => e.preventDefault());
  });

  /* ============================================================
     CÁMARA DE FONDO (opcional)
     ============================================================ */
  let flujo = null;
  $("btnCamara").addEventListener("click", async () => {
    const video = $("video");
    if (flujo) {
      flujo.getTracks().forEach(t => t.stop());
      flujo = null; video.style.display = "none"; video.srcObject = null;
      return;
    }
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = flujo;
      video.style.display = "block";
    } catch (e) {
      alert("No se pudo activar la cámara. Revisa el permiso del navegador.");
    }
  });

  /* ============================================================
     CÁMARA DEL JUEGO: se aleja si la pantalla es vertical
     ============================================================ */
  function ajustarCamara() {
    const aspecto = innerWidth / innerHeight;
    const k = aspecto < 1 ? (1 / aspecto) * 0.75 : 1;
    $("camara").setAttribute("position", `0 ${6.5 * k} ${6.5 * k}`);
  }
  window.addEventListener("resize", ajustarCamara);
  ajustarCamara();

  /* ============================================================
     CREAR OBJETOS en posiciones aleatorias
     ============================================================ */
  const aleatorio = (a, b) => a + Math.random() * (b - a);
  function puntoLibre() {
    let x, z;
    do {
      x = aleatorio(-LIMITE, LIMITE);
      z = aleatorio(-LIMITE, LIMITE);
    } while (Math.hypot(x - pos.x, z - pos.z) < 1.5);
    return { x, z };
  }

  function crearMoneda() {
    const cristal = Math.random() < 0.25;
    const el = document.createElement(cristal ? "a-octahedron" : "a-cylinder");
    const p = puntoLibre();
    el.setAttribute("radius", 0.28);
    if (cristal) {
      el.setAttribute("color", "#00BFFF");
      el.setAttribute("animation", "property: rotation; to: 360 360 0; loop: true; dur: 3000; easing: linear");
    } else {
      el.setAttribute("height", 0.1);
      el.setAttribute("color", "#FFD700");
      el.setAttribute("rotation", "90 0 0");
      el.setAttribute("animation", "property: rotation; to: 90 360 0; loop: true; dur: 2500; easing: linear");
    }
    el.setAttribute("position", `${p.x} 0.6 ${p.z}`);
    zona.appendChild(el);
    coleccionables.push({ el, x: p.x, z: p.z, valor: cristal ? 20 : 10, cristal });
  }

  function crearEnemigo() {
    const el = document.createElement("a-dodecahedron");
    const p = puntoLibre();
    el.setAttribute("radius", 0.32);
    el.setAttribute("color", "#E53935");
    el.setAttribute("animation", "property: rotation; to: 360 360 0; loop: true; dur: 1500; easing: linear");
    el.setAttribute("position", `${p.x} 0.6 ${p.z}`);
    zona.appendChild(el);
    enemigos.push({ el, x: p.x, z: p.z, objX: p.x, objZ: p.z });
  }

  function limpiarZona() {
    while (zona.firstChild) zona.removeChild(zona.firstChild);
    coleccionables = []; enemigos = [];
  }

  function quitar(el) {
    el.setAttribute("animation__salir", "property: scale; to: 0 0 0; dur: 200");
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
  }

  /* ============================================================
     BUCLE DEL JUEGO: movimiento y choques
     ============================================================ */
  let anterior = performance.now();
  function bucle(ahora) {
    const dt = Math.min((ahora - anterior) / 1000, 0.05);
    anterior = ahora;

    if (estado === "jugando") {
      // Movimiento del robot
      const dx = (teclas.der ? 1 : 0) - (teclas.izq ? 1 : 0);
      const dz = (teclas.abajo ? 1 : 0) - (teclas.arriba ? 1 : 0);
      if (dx || dz) {
        const n = Math.hypot(dx, dz);
        pos.x = Math.max(-LIMITE, Math.min(LIMITE, pos.x + (dx / n) * VEL_ROBOT * dt));
        pos.z = Math.max(-LIMITE, Math.min(LIMITE, pos.z + (dz / n) * VEL_ROBOT * dt));
        robot.object3D.rotation.y = Math.atan2(dx, dz);
      }
      robot.object3D.position.set(pos.x, 0, pos.z);

      // Recoger monedas y cristales
      for (let i = coleccionables.length - 1; i >= 0; i--) {
        const c = coleccionables[i];
        if (Math.hypot(c.x - pos.x, c.z - pos.z) < RADIO_CHOQUE) {
          coleccionables.splice(i, 1);
          quitar(c.el);
          recoger(c);
          if (estado !== "jugando") break;
        }
      }

      // Enemigos: se mueven solos y restan puntos al chocar
      const vel = NIVELES[nivel].velEnemigo;
      for (let i = enemigos.length - 1; i >= 0 && estado === "jugando"; i--) {
        const e = enemigos[i];
        let ex = e.objX - e.x, ez = e.objZ - e.z;
        const d = Math.hypot(ex, ez);
        if (d < 0.1) {
          e.objX = aleatorio(-LIMITE, LIMITE);
          e.objZ = aleatorio(-LIMITE, LIMITE);
        } else {
          e.x += (ex / d) * vel * dt;
          e.z += (ez / d) * vel * dt;
        }
        e.el.object3D.position.set(e.x, 0.6, e.z);

        if (ahora > invulnerableHasta && Math.hypot(e.x - pos.x, e.z - pos.z) < RADIO_CHOQUE) {
          invulnerableHasta = ahora + 1000;
          enemigos.splice(i, 1);
          quitar(e.el);
          golpe();
        }
      }
    }
    requestAnimationFrame(bucle);
  }

  function recoger(c) {
    puntosNivel += c.valor;
    puntosTotal += c.valor;
    c.cristal ? sonidoCristal() : sonidoMoneda();
    animarRobot("Jump", 800);
    actualizarPanel();
    if (puntosNivel >= NIVELES[nivel].meta) return terminarNivel();
    setTimeout(() => { if (estado === "jugando") crearMoneda(); }, 300);
  }

  function golpe() {
    puntosTotal = Math.max(0, puntosTotal - PUNTOS_ENEMIGO);
    puntosNivel = Math.max(0, puntosNivel - PUNTOS_ENEMIGO);
    sonidoEnemigo();
    animarRobot("No", 900);
    actualizarPanel();
    setTimeout(() => { if (estado === "jugando") crearEnemigo(); }, 1200);
  }

  /* ============================================================
     FLUJO DEL JUEGO: niveles, victoria y derrota
     ============================================================ */
  function iniciarNivel() {
    const cfg = NIVELES[nivel];
    puntosNivel = 0;
    tiempo = cfg.tiempo;
    pos.x = 0; pos.z = 0;
    limpiarZona();
    estado = "jugando";
    for (let i = 0; i < cfg.monedas; i++) crearMoneda();
    for (let i = 0; i < cfg.enemigos; i++) crearEnemigo();
    actualizarPanel();
    $("pantalla").classList.add("oculta");
  }

  function terminarNivel() {
    limpiarZona();
    guardarRecord();
    if (nivel === NIVELES.length - 1) return victoria();
    sonidoNivel();
    estado = "pausa";
    mostrarPantalla(`¡Nivel ${nivel + 1} completado!`,
      `Llevas ${puntosTotal} puntos. El siguiente nivel tiene ${NIVELES[nivel + 1].tiempo} segundos y más enemigos.`,
      "Siguiente nivel", () => { nivel++; iniciarNivel(); });
  }

  function victoria() {
    estado = "fin";
    sonidoNivel(); setTimeout(sonidoNivel, 600);
    animarRobot("Dance", 60000);
    const nuevo = puntosTotal >= record && puntosTotal > 0;
    mostrarPantalla("🏆 ¡VICTORIA!",
      `Completaste los 3 niveles con ${puntosTotal} puntos.` + (nuevo ? " ¡Nuevo récord!" : ` Tu récord es ${record}.`),
      "Jugar de nuevo", nuevaPartida);
  }

  function derrota() {
    estado = "fin";
    limpiarZona();
    guardarRecord();
    sonidoDerrota();
    animarRobot("Death", 60000);
    mostrarPantalla("Se acabó el tiempo",
      `No llegaste a la meta del nivel ${nivel + 1}. Puntos: ${puntosTotal} · Récord: ${record}`,
      "Intentar de nuevo", nuevaPartida);
  }

  function nuevaPartida() {
    nivel = 0; puntosTotal = 0;
    robotGLB.setAttribute("animation-mixer", "clip: Idle");
    iniciarNivel();
  }

  function mostrarPantalla(titulo, texto, boton, accion) {
    $("pTitulo").textContent = titulo;
    $("pTexto").textContent = texto;
    $("pBoton").textContent = boton;
    $("pBoton").onclick = () => { activarAudio(); accion(); };
    $("pantalla").classList.remove("oculta");
  }

  /* ============================================================
     PANEL Y TEMPORIZADOR
     ============================================================ */
  function actualizarPanel() {
    $("nivel").textContent = nivel + 1;
    $("puntos").textContent = puntosTotal;
    $("meta").textContent = `${puntosNivel} / ${NIVELES[nivel].meta}`;
    $("tiempo").textContent = tiempo;
    $("record").textContent = record;
  }

  setInterval(() => {
    if (estado !== "jugando") return;
    tiempo--;
    $("tiempo").textContent = tiempo;
    if (tiempo <= 0) derrota();
  }, 1000);

  $("reiniciar").addEventListener("click", () => { activarAudio(); nuevaPartida(); });
  $("pBoton").onclick = () => { activarAudio(); nuevaPartida(); };

  actualizarPanel();
  requestAnimationFrame(bucle);
</script>

</body>
</html>
